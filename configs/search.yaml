methods: [NSGA-II, NSGA-III, Random]
runs_per_method: 15
population_size: 28
evaluations_per_run: 280
evaluation_blocks: [28, 56, 84, 112, 140, 168, 196, 224, 252, 280]
run_seeds: [20270001, 20270002, 20270003, 20270004, 20270005, 20270006, 20270007, 20270008, 20270009, 20270010, 20270011, 20270012, 20270013, 20270014, 20270015]
training_seeds: [41001, 41002, 41003, 41004, 41005, 41006, 41007, 41008, 41009, 41010, 41011, 41012, 41013, 41014, 41015]
training:
  search: {teacher_epochs: 80, rollout_epochs: 18}
  rescreen: {teacher_epochs: 160, rollout_epochs: 30, patience: 30, minimum_epochs: 10}
