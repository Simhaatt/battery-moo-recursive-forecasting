objectives: [validation_macro_MAPE, log10_parameters, log10_latency_ms]
space:
  window_length: [10, 15, 20]
  hidden_size: [64, 96, 128, 160, 192]
  layers: [1, 2, 3]
  rollout_horizon: [3, 5, 8, 10, 15]
  learning_rate: {distribution: log_uniform, low: 0.0001, high: 0.002}
constraint: "window_length + rollout_horizon <= 29"
