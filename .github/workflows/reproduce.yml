name: reproduce

# Level-1 reproduction: recompute reported summaries, figures and tables from
# the deposited artifacts, then run the test suite. No GPU, no raw datasets.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 1 * *"   # monthly, so bit-rot surfaces before a reviewer finds it
  workflow_dispatch:

jobs:
  level1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Level-1 reproduction
        run: python analysis/reproduce_all.py

      - name: Assert OVERALL PASS
        run: |
          python - <<'PY'
          import json, sys, pathlib
          p = pathlib.Path("results/reproduction_check.json")
          if not p.exists():
              sys.exit("results/reproduction_check.json was not produced")
          data = json.loads(p.read_text())
          status = str(data.get("overall_status", data.get("overall", ""))).upper()
          print(json.dumps(data, indent=2)[:2000])
          if "PASS" not in status:
              sys.exit(f"reproduction check did not pass: {status!r}")
          PY

      - name: Test suite
        run: pytest -q

      - name: Upload regenerated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level1-outputs
          path: |
            figures/generated/
            results/generated/
            results/reproduction_check.json
          if-no-files-found: warn
